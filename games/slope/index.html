<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Slope 3D</title>
  <link rel="stylesheet" href="../../TemplateData/style.css">
  <style>
    html,body,#gameContainer { width:100%; height:100%; margin:0; overflow:hidden; background:#050505; }
    #loading { position:absolute; inset:0; display:grid; place-items:center; color:#b797e5; font:14px sans-serif; pointer-events:none; }
    #gameContainer canvas { width:100%; height:100%; }
  </style>
  <script src="../../TemplateData/UnityProgress.js"></script>
  <script src="../../TemplateData/unityloader41.js"></script>
</head>
<body>
  <div id="gameContainer" class="webgl-content"></div>
  <div id="loading" role="status">Loading Slope 3D…</div>
  <script>
    var gameInstance = UnityLoader.instantiate('gameContainer', '../../Build/slope.json', {
      onProgress: function(instance, progress) {
        UnityProgress(instance, progress);
        if (progress === 1) document.getElementById('loading').style.display = 'none';
      },
      Module: { onRuntimeInitialized: function() {
        UnityProgress(gameInstance, 1);
        document.getElementById('loading').style.display = 'none';
      } }
    });
  </script>
</body>
</html>
