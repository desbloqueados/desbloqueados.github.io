<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Flight Simulator</title>
<style>*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#07101c;color:#fff;font-family:Arial,sans-serif}canvas{display:block;width:100%;height:100%;touch-action:none}.top{position:fixed;z-index:4;top:10px;left:10px;display:flex;gap:8px}.top a,.top button{padding:9px 12px;color:#eee;background:#171326d9;border:1px solid #7846bd;border-radius:8px;text-decoration:none;font:13px Arial;cursor:pointer}.help{position:fixed;z-index:3;top:12px;left:50%;transform:translateX(-50%);padding:7px 12px;border-radius:8px;background:#07101c99;font-size:12px;white-space:nowrap;pointer-events:none}.touch{position:fixed;z-index:4;inset:auto 14px 14px;display:none;justify-content:space-between;pointer-events:none}.pad,.power{display:grid;gap:7px;pointer-events:auto}.pad{grid-template:48px 48px 48px/48px 48px 48px}.pad button:nth-child(1){grid-area:1/2}.pad button:nth-child(2){grid-area:2/1}.pad button:nth-child(3){grid-area:2/3}.pad button:nth-child(4){grid-area:3/2}.power{grid-template-columns:58px 58px;align-content:end}.touch button{border:1px solid #ffffff66;border-radius:12px;color:#fff;background:#11192caa;font-size:20px;touch-action:none}.notice{position:fixed;z-index:5;left:50%;top:18%;transform:translateX(-50%);padding:12px 18px;background:#111827d9;border:1px solid #ffffff55;border-radius:10px;font-weight:bold;opacity:0;transition:opacity .2s;pointer-events:none}.notice.show{opacity:1}@media(pointer:coarse),(max-width:760px){.touch{display:flex}.help{top:56px;font-size:10px}.top button{display:none}}</style></head>
<body><canvas id="game" aria-label="Flight simulator"></canvas><div class="top"><a href="../../index.html">← games</a><button id="reset">reset flight</button></div><div class="help">W/S pitch · A/D roll · Q/E yaw · Shift/Ctrl throttle · R reset</div><div class="notice" id="notice"></div><div class="touch"><div class="pad"><button data-key="KeyW">▲</button><button data-key="KeyA">◀</button><button data-key="KeyD">▶</button><button data-key="KeyS">▼</button></div><div class="power"><button data-key="ControlLeft">−</button><button data-key="ShiftLeft">+</button></div></div>
<script>(function(){'use strict';var canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),keys={},dpr=1,w=0,h=0,last=performance.now(),timer=0,plane;
function reset(){plane={alt:850,speed:155,throttle:.62,pitch:0,bank:0,heading:0,x:0,z:0,vertical:0,landed:false};flash('FLIGHT RESET')}function resize(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}function flash(s){var n=document.getElementById('notice');n.textContent=s;n.classList.add('show');clearTimeout(timer);timer=setTimeout(function(){n.classList.remove('show')},1200)}function held(a,b){return keys[a]||keys[b]}
function update(dt){var pi=(held('KeyW','ArrowUp')?1:0)-(held('KeyS','ArrowDown')?1:0),ri=(held('KeyD','ArrowRight')?1:0)-(held('KeyA','ArrowLeft')?1:0),yi=(keys.KeyE?1:0)-(keys.KeyQ?1:0);if(keys.ShiftLeft||keys.ShiftRight)plane.throttle+=dt*.32;if(keys.ControlLeft||keys.ControlRight)plane.throttle-=dt*.32;plane.throttle=Math.max(0,Math.min(1,plane.throttle));plane.pitch+=pi*dt*.58-plane.pitch*dt*.12;plane.bank+=ri*dt*.9-plane.bank*dt*.35;plane.pitch=Math.max(-.62,Math.min(.62,plane.pitch));plane.bank=Math.max(-1.15,Math.min(1.15,plane.bank));plane.heading+=(Math.sin(plane.bank)*.22+yi*.25)*dt;var target=75+plane.throttle*210-plane.pitch*32;plane.speed+=(target-plane.speed)*dt*.32;plane.vertical+=(Math.sin(plane.pitch)*plane.speed-plane.vertical)*dt*.8;plane.alt+=plane.vertical*dt;plane.x+=Math.sin(plane.heading)*plane.speed*dt;plane.z+=Math.cos(plane.heading)*plane.speed*dt;if(plane.alt<8){plane.alt=8;plane.vertical=Math.max(0,plane.vertical);plane.pitch=Math.max(plane.pitch,.05);if(!plane.landed)flash(plane.speed>115?'HARD LANDING':'LANDED');plane.landed=true}else if(plane.alt>12)plane.landed=false}
function line(a,b,c,d,color,width){ctx.strokeStyle=color;ctx.lineWidth=width||1;ctx.beginPath();ctx.moveTo(a,b);ctx.lineTo(c,d);ctx.stroke()}function world(){ctx.save();ctx.translate(w/2,h/2);ctx.rotate(-plane.bank);var hy=plane.pitch*h*.72,sky=ctx.createLinearGradient(0,-h,0,hy);sky.addColorStop(0,'#1769ad');sky.addColorStop(1,'#9bd9f1');ctx.fillStyle=sky;ctx.fillRect(-w,-h*1.5,w*2,h*1.5+hy);var ground=ctx.createLinearGradient(0,hy,0,h);ground.addColorStop(0,'#78825d');ground.addColorStop(.4,'#3f633d');ground.addColorStop(1,'#19331f');ctx.fillStyle=ground;ctx.fillRect(-w,hy,w*2,h*2);var vx=Math.sin(plane.heading)*w*.28;for(var i=1;i<=22;i++){var t=i/22,y=hy+(h*1.2-hy)*Math.pow(t,2.15);line(-w,y,w,y,'rgba(220,235,190,'+(.08+.25*t)+')')}for(var g=-16;g<=16;g++){var bottom=g*w/7-((plane.x*.7)%(w/7));line(vx+g*3,hy,bottom,h*1.2,'rgba(218,235,188,.22)')}var shift=((plane.x*.18)%500)-250;ctx.fillStyle='#51575a';ctx.beginPath();ctx.moveTo(vx+shift*.03,hy);ctx.lineTo(vx+shift*.03+18,hy);ctx.lineTo(shift+180,h*1.2);ctx.lineTo(shift-180,h*1.2);ctx.fill();ctx.strokeStyle='#eee';ctx.lineWidth=3;ctx.setLineDash([18,22]);ctx.beginPath();ctx.moveTo(vx+shift*.03+9,hy);ctx.lineTo(shift,h*1.2);ctx.stroke();ctx.setLineDash([]);ctx.restore()}
function text(s,x,y,size,align){ctx.font=(size||14)+'px monospace';ctx.textAlign=align||'left';ctx.fillStyle='#79ffb0';ctx.fillText(s,x,y)}function hud(){var x=w/2,y=h/2;ctx.strokeStyle='#79ffb0';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x-75,y);ctx.lineTo(x-20,y);ctx.lineTo(x-10,y+8);ctx.moveTo(x+75,y);ctx.lineTo(x+20,y);ctx.lineTo(x+10,y+8);ctx.moveTo(x,y-7);ctx.lineTo(x,y+7);ctx.stroke();text('SPD '+Math.round(plane.speed)+' KT',18,h-54,16);text('ALT '+Math.round(plane.alt)+' FT',18,h-32,16);text('V/S '+(plane.vertical>=0?'+':'')+Math.round(plane.vertical*60),18,h-10,13);text('HDG '+String((Math.round(plane.heading*180/Math.PI)%360+360)%360).padStart(3,'0')+'°',w-18,h-54,16,'right');text('THR '+Math.round(plane.throttle*100)+'%',w-18,h-32,16,'right');ctx.strokeStyle='#79ffb0';ctx.strokeRect(w-118,h-19,100,8);ctx.fillStyle='#79ffb0';ctx.fillRect(w-117,h-18,98*plane.throttle,6)}function frame(now){var dt=Math.min((now-last)/1000,.05);last=now;update(dt);ctx.clearRect(0,0,w,h);world();hud();requestAnimationFrame(frame)}
addEventListener('resize',resize);addEventListener('keydown',function(e){if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();keys[e.code]=true;if(e.code==='KeyR')reset()});addEventListener('keyup',function(e){keys[e.code]=false});addEventListener('blur',function(){keys={}});document.getElementById('reset').onclick=reset;document.querySelectorAll('[data-key]').forEach(function(b){function on(e){e.preventDefault();keys[b.dataset.key]=true}function off(e){e.preventDefault();keys[b.dataset.key]=false}b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('pointerleave',off)});resize();reset();requestAnimationFrame(frame)}());</script></body></html>
